<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy2point0 - Access Gate</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 32px;
            animation: fade-in 0.4s ease;
        }
        .login-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .login-icon {
            font-size: 36px;
            color: var(--accent);
            text-shadow: 0 0 16px var(--accent-glow);
        }
        .login-header h1 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <!-- Background Gradient Glows -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="login-container">
        <div class="card login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1>Fantasy2.0 Access</h1>
                <p>Enter the league password to access the draft board.</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST" class="form-card">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required class="form-select" style="cursor: text; background: rgba(39, 39, 42, 0.4);" aria-label="Password">
                </div>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="status-msg error" style="margin-top: 0;">
                            {{ messages[0] }}
                        </div>
                    {% endif %}
                {% endwith %}

                <button type="submit" class="btn btn-primary btn-block">
                    Unlock Site <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
